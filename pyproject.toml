[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-trading-bot"
version = "0.1.0"
description = "Autonomous algorithmic trading bot for Kalshi tennis prediction markets powered by iPredictSport quantitative ML models."
readme = "README.md"
authors = [
  { name = "iPredictSport", email = "alex.c.houck@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "kalshi",
  "prediction-markets",
  "trading-bot",
  "algorithmic-trading",
  "tennis",
  "machine-learning",
  "kelly-criterion",
  "mcp"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.28.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
kalshi = [
  "cryptography>=41.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
]

[project.scripts]
tennis-bot = "tennis_trading_bot.cli:main"

[project.urls]
Homepage = "https://ipredictsport.com"
Repository = "https://github.com/ipredictsport/tennis-trading-bot"
Documentation = "https://ipredictsport.com/about.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

